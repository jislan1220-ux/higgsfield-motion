<!doctype html>
<html><head><meta charset="utf-8"><title>Higgsfield Claude 16x9</title>
<style>
@font-face{font-family:LG;src:url(fonts/LeagueGothic.ttf)}

.gl{background-image:linear-gradient(115deg,transparent calc(var(--sh) - 12%),rgba(255,255,255,.16) var(--sh),transparent calc(var(--sh) + 12%)),linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.035) 38%,rgba(255,255,255,.015) 62%,rgba(255,255,255,.09) 100%);backdrop-filter:blur(14px) saturate(1.9) brightness(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.9) brightness(1.1);border:1px solid rgba(255,255,255,.26)!important;box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.07),0 18px 50px rgba(0,0,0,.35)}
.lgo{background-image:linear-gradient(115deg,transparent calc(var(--sh) - 12%),rgba(255,255,255,.2) var(--sh),transparent calc(var(--sh) + 12%)),linear-gradient(135deg,rgba(255,170,110,.32) 0%,rgba(255,122,26,.12) 45%,rgba(255,122,26,.06) 60%,rgba(255,190,140,.22) 100%);backdrop-filter:blur(14px) saturate(2) brightness(1.15);-webkit-backdrop-filter:blur(14px) saturate(2) brightness(1.15);border:1px solid rgba(255,200,160,.55)!important;box-shadow:inset 1.5px 1.5px 0 rgba(255,235,220,.75),inset -1px -1px 0 rgba(255,170,110,.25),inset 0 0 26px rgba(255,122,26,.4),0 0 34px rgba(255,122,26,.35),0 18px 50px rgba(0,0,0,.35);color:#fff3ea!important;text-shadow:0 0 14px rgba(255,140,60,.9)}
.flt{position:absolute;font:500 24px 'JetBrains Mono';padding:10px 18px;border-radius:14px;color:#ffe6d2;background:rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(1.7);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);white-space:nowrap}
.chip{padding:0 .3em;border-radius:.3em;background:linear-gradient(135deg,rgba(255,170,110,.35),rgba(255,122,26,.12));backdrop-filter:blur(10px) saturate(2);border:1px solid rgba(255,200,160,.6);box-shadow:inset 1px 1px 0 rgba(255,235,220,.8),inset 0 0 14px rgba(255,122,26,.45),0 0 18px rgba(255,122,26,.4);color:#fff3ea;text-shadow:0 0 10px rgba(255,140,60,.9)}
</style></head><body>
<div id="cam"><canvas id="bg" width="960" height="540" style="position:absolute;inset:0;width:1920px;height:1080px"></canvas><div id="deep" style="position:absolute;inset:0"></div><div id="clipbg" style="position:absolute;inset:0;overflow:hidden"></div><div id="fgp" style="position:absolute;inset:0"></div><div id="fg"></div><div id="hudl" style="position:absolute;inset:0"></div><canvas id="fx" width="1920" height="1080"></canvas></div><div id="ov"></div>
<script src="peaks.js"></script>
<script>
// cenas do Seedance entram no meio da narracao, duração por cena em INSB (v16: cortes secos na batida, mais 3D; v17/v18: cerco e dragão com 24 batidas)
const INSL=JSON.parse(new URLSearchParams(location.search).get('ins')||'[[3.288,"c1"],[11.18,"c2"]]');
// v17: cada insercao tem sua duracao [batidas no total, batidas em tela cheia]; o cerco ganhou 24 batidas
const BPS=60/152,INSB={c1:[24,12],c2:[24,12],c3:[16,8]},LEN=c=>INSB[c][0]*BPS,HALF=c=>INSB[c][1]*BPS;
const INS=INSL.length?INSL[0][0]:99;
function toReal(m){let r=m;for(const[a,c]of INSL)if(m>=a)r+=LEN(c);return r}
function fromReal(t){let off=0;for(const[a,c]of INSL){const ra=a+off;if(t<ra)return{m:t-off};if(t<ra+LEN(c))return{m:a,clip:c,lu:t-ra,ra};off+=LEN(c)}return{m:t-off}}
const W=1920,H=1080,DUR=25.5+INSL.reduce((s,[a,c])=>s+LEN(c),0),LIME='#ff7a1a',PINK='#ff4a3d';
const HF='<svg viewBox="0 0 20 20" style="height:1em;width:1em;vertical-align:-.12em" fill="currentColor"><path d="M18.3498 9.83713L18.3339 9.65759C18.1831 7.93447 17.0963 4.69261 14.0816 4.69261C11.8445 4.69261 10.1545 6.97097 8.66311 8.97967C7.47302 10.5883 6.4419 11.9683 5.3073 11.9683C5.00574 11.9357 4.61708 11.7805 4.3792 11.4294C4.16497 11.1108 4.10948 10.7026 4.22046 10.2126C4.39489 9.43684 5.39463 8.7182 6.44963 7.95063C7.02864 7.54238 7.6238 7.10955 8.03634 6.69311C9.22643 5.5091 9.82932 4.65164 9.82932 3.2717C9.82932 1.89176 9.09157 1.20565 8.47276 0.911636C7.23514 0.323844 5.41851 0.666781 4.26026 1.69583C4.08583 1.85922 3.91117 2.01418 3.75243 2.16119C2.58622 3.23097 1.80094 3.95781 0 3.40232V5.63972C2.38791 6.72588 4.39512 4.65164 5.15675 3.69633C5.74372 3.06758 6.36253 2.70006 6.82283 2.70006H6.84671C7.05298 2.70825 7.22741 2.78995 7.35454 2.93696C7.56081 3.18204 7.64018 3.46786 7.60038 3.78622C7.51305 4.45594 6.83875 5.23967 5.60113 6.09713C4.14928 7.10159 1.7218 8.78374 1.53122 10.8987C1.3884 12.4177 2.15003 13.9365 3.34012 14.5243C6.11669 15.8798 7.80665 13.5444 9.5994 11.0783C10.9719 9.1756 12.273 7.37103 14.0818 7.37103C15.7081 7.37103 16.311 8.75916 16.311 9.63301V9.80459L16.1523 9.83713C12.2095 10.5558 10.0595 14.3611 10.0595 16.1167C10.0595 17.8724 11.5034 19.375 13.2804 19.375C15.359 19.375 17.9293 17.5458 18.3419 12.4013L18.3578 12.2136H20V9.83737H18.3498V9.83713ZM16.1998 12.4746C15.8826 15.5531 14.3513 16.9904 13.4232 16.9904C13.0027 16.9904 12.4158 16.631 12.4158 15.9615C12.4158 15.2104 13.5026 12.932 15.946 12.2543L16.2316 12.1808L16.1998 12.4748V12.4746Z"/></svg>';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4), ei=x=>x*x*x, eio=x=>x<.5?8*x**4:1-Math.pow(-2*x+2,4)/2;
const back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const spring=(x,k=9,f=13)=>x<=0?0:1-Math.exp(-k*x)*Math.cos(f*x);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- eventos globais: batidas, flashes, slashes, faiscas ---------- */
const HITS=[[.88,1],[3.0,.7],[3.58,1],[4.66,1],[7.68,.35],[9.30,.45],[10.48,.8],[11.52,.6],[13.55,.9],[15.22,.8],[16.30,.7],[17.06,.9],[19.56,.5],[21.98,.8],[23.25,1]];
const FLASH=[[3.58,LIME,.09],[10.6,LIME,.07],[15.22,LIME,0],[23.25,'#fff',.06]];
const SLASH=[ // t, x0,y0,x1,y1
 [2.98,-100,980,2050,80],[13.52,-80,120,2000,1000],[23.22,-120,860,2060,220]];
const BURST=[ // t,x,y,n,spread(rad),dir,speed
 [.88,960,640,70,Math.PI*2,0,1],[3.0,960,520,90,Math.PI*2,0,1.2],[4.66,1240,690,120,Math.PI*2,0,1.4],
 [10.48,1500,540,60,Math.PI*2,0,1],[13.52,960,560,120,Math.PI*2,0,1.3],[17.06,960,700,80,Math.PI*2,0,1.1],
 [21.98,1180,700,110,Math.PI*2,0,1.3],[23.25,960,540,150,Math.PI*2,0,1.5]];
const SH=toReal;
[HITS,FLASH,SLASH,BURST].forEach(A=>A.forEach(e=>e[0]=SH(e[0])));
function shake(t){let s=0;for(const[h,k]of HITS){const d=t-h;if(d>=0&&d<.35)s+=k*11*Math.exp(-d*14)}return s}
function hitAmt(t,h,len=.25){const d=t-h;return d>=0&&d<len?Math.exp(-d*12):0}

/* ---------- helpers de texto ---------- */
// letras batendo: cada letra cai/escala com atraso
function slam(txt,t,t0,o){return ''}
function slam_old(txt,t,t0,{x=960,y=540,size=220,color='#f3f3f3',cls='H',stag=.035,from='up',glow=0,anchor='center',ls=null,skew=0}={}){
  if(t<t0)return'';let h='';[...txt].forEach((c,i)=>{const p=P(t,t0+i*stag,t0+i*stag+.22),s=spring(p*1.25,10,14);
    const dy=from==='up'?-(1-s)*size*.9:(1-s)*size*.9, sc=1+(1-s)*.6, bl=(1-cl(p*1.6))*18;
    h+=`<span class="ch" style="transform:translate(0,${dy}px) scale(${sc});opacity:${cl(p*4)};filter:blur(${bl}px)">${c===' '?'&nbsp;':c}</span>`});
  const ax=anchor==='center'?'-50%':anchor==='left'?'0':'-100%';
  const gl=glow?`text-shadow:0 0 ${size*.12}px ${color}${Math.round(glow*99).toString().padStart(2,'0')},0 0 ${size*.35}px ${color}55;`:'';
  return `<div class="a ${cls}" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};${gl}${ls!==null?`letter-spacing:${ls}em;`:''}transform:translate(${ax},-50%) skewX(${skew}deg)">${h}</div>`;
}
// aberracao cromatica em volta de um bloco, nas entradas
function rgb(html,amt){if(amt<.02)return html;const d=amt*14;
  return `<div style="position:absolute;inset:0;mix-blend-mode:screen;opacity:.75;transform:translateX(${-d}px);filter:url(#r)">${html}</div>`+html}
// header: texto pequeno no topo esquerdo com chip verde na palavra-chave
const WT=[["olha", 0.0], ["só", 0.24], ["o", 0.6], ["que", 0.7], ["eu", 0.78], ["consigo", 0.84], ["fazer", 1.12], ["com", 1.48], ["o", 1.74], ["higgsfield", 1.86], ["e", 2.4], ["o", 2.52], ["claude", 2.58], ["caralho", 3.58], ["é", 4.12], ["muito", 4.2], ["foda", 4.66], ["isso", 5.28], ["eu", 6.18], ["só", 6.28], ["falo", 6.4], ["o", 6.78], ["que", 6.88], ["eu", 6.88], ["quero", 7.0], ["o", 7.58], ["claude", 7.68], ["monta", 8.04], ["a", 8.52], ["ideia", 8.56], ["e", 8.92], ["o", 9.22], ["higgsfield", 9.3], ["transforma", 9.82], ["em", 10.38], ["vídeo", 10.48], ["sem", 11.28], ["after", 11.52], ["sem", 12.24], ["passar", 12.34], ["a", 12.64], ["madrugada", 12.78], ["editando", 13.28], ["e", 14.2], ["o", 14.36], ["melhor", 14.42], ["o", 15.22], ["higgsfield", 15.34], ["tá", 15.88], ["dando", 16.06], ["3", 16.3], ["dias", 16.7], ["grátis", 17.06], ["pra", 17.64], ["você", 17.78], ["que", 18.18], ["assinar", 18.36], ["o", 18.64], ["claude", 18.76], ["comenta", 19.56], ["aqui", 19.94], ["higgsfield", 20.46], ["que", 21.28], ["eu", 21.36], ["te", 21.44], ["mando", 21.52], ["passo", 21.98], ["a", 22.16], ["passo", 22.32]];
const norm=w=>w.toLowerCase().replace(/[^a-zà-ú0-9]/g,'');
function wtimes(words,t0){let j=WT.findIndex(x=>x[1]>=t0-.45);if(j<0)j=WT.length;const out=[];let last=t0;
  for(const w of words){let k=-1;for(let q=j;q<Math.min(WT.length,j+4);q++)if(norm(WT[q][0])===norm(w)){k=q;break}
    if(k>=0){last=WT[k][1];j=k+1}else last+=.14;out.push(last)}return out}
function header(){return ''}
function header_old(t,t0,words,key,{y=135}={}){if(t<t0-.15)return'';const W=words.split(' '),T0=wtimes(W,t0);let h='',ghost=true;
  W.forEach((w,i)=>{const p=P(t,T0[i],T0[i]+.22),sp=spring(p*1.3,10,14);let st;
    if(p>0)st=`opacity:${cl(p*3)};filter:blur(${(1-cl(p*1.6))*10}px);transform:translateY(${(1-sp)*16}px) scale(${.82+.18*sp})`;
    else if(ghost){ghost=false;st='opacity:.22;filter:blur(1.5px)'}else st='opacity:0';
    const kp=i===key?eo(P(t,T0[i],T0[i]+.25)):0;
    h+=`<span style="display:inline-block;${st}">${i===key?`<span style="position:relative;padding:0 .28em"><i style="position:absolute;inset:-.05em 0;border-radius:.2em;background:linear-gradient(135deg,rgba(255,170,110,.38),rgba(255,122,26,.14));border:1px solid rgba(255,200,160,.6);box-shadow:inset 1px 1px 0 rgba(255,235,220,.8),inset 0 0 14px rgba(255,122,26,.5),0 0 20px rgba(255,122,26,.45);transform:scaleX(${kp});transform-origin:left"></i><b style="position:relative;color:${kp>.5?'#fff3ea':'inherit'};text-shadow:${kp>.5?'0 0 10px rgba(255,140,60,.9)':'none'}">${w}</b></span>`:w}</span> `});
  return `<div class="a I gl" style="left:170px;top:${y}px;font-size:30px;color:#f6ece4;letter-spacing:-.01em;padding:12px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.2)">${h}</div>`;}
function hud(t,label){ // marcas de interface nos cantos
  return `<div class="a M" style="left:80px;bottom:56px;font-size:16px;color:#5d5d5d">VICTOR-DIAS.MP4 &nbsp;/&nbsp; ${label}</div>
  <div class="a M" style="right:80px;bottom:56px;font-size:16px;color:#5d5d5d">${String(Math.floor(t)).padStart(2,'0')}:${String(Math.floor(t%1*30)).padStart(2,'0')} &nbsp; HIGGSFIELD × CLAUDE</div>
  <div class="a" style="right:80px;top:70px;width:56px;height:4px;background:#2a2a2a"><div style="width:${(t/DUR)*100}%;height:100%;background:${LIME}"></div></div>`;}
const mola=p=>p<=0?0:p<.6?1.08*eo(p/.6):1.08-.08*eio((p-.6)/.4);
function box(x,y,w,h,{p=1,col=LIME,label='',fill=false,size=34,glow=true,r=14,tc}={}){
  if(p<=0)return'';const sc=mola(cl(p)),ct=cl((p-.45)/.4);
  return `<div class="a M ${fill?'lgo':'gl'}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;border-radius:${Math.max(r,22)}px;
   color:${tc||(fill?'#fff3ea':'#ffd9bd')};display:flex;align-items:center;justify-content:center;font-size:${size}px;
   transform:perspective(900px) rotateX(${(1-cl(p))*14}deg) rotateY(${(1-cl(p))*-12}deg) scale(${sc});opacity:${cl(p*4)}"><span style="opacity:${ct};filter:blur(${(1-ct)*6}px);transform:translateY(${(1-eo(ct))*10}px);display:inline-block">${label}</span></div>`;}

/* ---------- cenas ---------- */
const SC=[
 // 1. OLHA SÓ
 {s:0,e:1.48,lab:'01 INTRO',f:t=>{
   const dot=t<.2?`<div class="a" style="left:960px;top:540px;width:${24*eo(P(t,0,.1))}px;height:${24*eo(P(t,0,.1))}px;margin:-12px;border-radius:50%;background:${LIME};box-shadow:0 0 30px ${LIME}"></div>`:'';
   return dot+rgb(slam('OLHA',t,0.02,{y:420,size:300})+slam('SÓ',t,.24,{y:660,size:300,color:LIME,glow:.6}),hitAmt(t,.88)+hitAmt(t,.05))+
   header(t,.6,'olha só o que eu consigo fazer',6);}},
 // 2. nós Higgsfield -> Claude
 {s:1.48,e:3.3,lab:'02 STACK',f:t=>{
   const pa=P(t,1.86,2.4),pb=P(t,2.58,3.0),ln=eo(P(t,2.2,2.6)),cut=t>2.98;
   const off=cut?eo(P(t,2.98,3.3))*80:0;
   const g=`<div style="position:absolute;inset:0;transform:translate(${-off}px,${off}px) rotate(${-off*.04}deg);opacity:${1-P(t,3.1,3.3)}">`+
     `<div class="a" style="left:880px;top:540px;height:3px;width:${160*ln}px;background:${LIME};box-shadow:0 0 14px ${LIME}"></div>`+
     box(620,540,520,160,{p:pa,label:`<span style="font-size:1.25em;margin-right:.35em">${HF}</span>HIGGSFIELD`,size:46})+box(1300,540,520,160,{p:pb,label:'CLAUDE',fill:t>2.8,size:46})+
     `<div class="a M" style="left:620px;top:650px;transform:translateX(-50%);font-size:22px;color:#888;opacity:${cl(pa*2)}">VÍDEO · IMAGEM · ÁUDIO</div>`+
     `<div class="a M" style="left:1300px;top:650px;transform:translateX(-50%);font-size:22px;color:#888;opacity:${cl(pb*2)}">ROTEIRO · CENAS · RITMO</div></div>`;
   // cometa entrando
   const cp=P(t,1.5,1.86),cx=-40+(410-(-40))*eo(cp);
   const com=t<1.95?`<div class="a" style="left:${cx}px;top:540px;width:${180*(1-cp)+20}px;height:6px;margin-top:-3px;transform:translateX(-100%);background:linear-gradient(90deg,transparent,${LIME});border-radius:3px"></div><div class="a" style="left:${cx}px;top:540px;width:20px;height:20px;margin:-10px;border-radius:50%;background:${LIME};box-shadow:0 0 24px ${LIME}"></div>`:'';
   return header(t,1.48,'com o Higgsfield e o Claude',2)+g+com;}},
 // 3. CARALHO, MUITO FODA.
 {s:3.3,e:6.05,lab:'03 REAÇÃO',f:t=>{
   const out=P(t,5.7,6.05),sx=1+ei(out)*2.5,o=1-ei(out);
   return `<div style="position:absolute;inset:0;transform:scaleX(${sx});opacity:${o};filter:blur(${out*12}px)">`+
   rgb(slam('CARALHO,',t,3.58,{y:380,size:250,stag:.025})+slam('MUITO',t,4.20,{x:925,anchor:'right',y:640,size:230,color:'#fff4ea',glow:.2,stag:.03})+
   slam('FODA.',t,4.66,{x:975,anchor:'left',y:640,size:230,color:LIME,glow:.8,stag:.03}),hitAmt(t,3.58,.3)+hitAmt(t,4.66,.3))+
   (t>5.28?`<div class="a M" style="display:none;left:960px;top:800px;transform:translateX(-50%);font-size:26px;color:#9a9a9a;opacity:${cl(P(t,5.28,5.4)*2)}">[ isso! ]</div>`:'')+'</div>';}},
 // 4. O PROMPT
 {s:6.05,e:7.55,lab:'04 PROMPT',f:t=>{
   const pb=P(t,6.1,6.4),tp=cl((t-6.4)/1.0);
   // v19: a caixa digita a fala do Victor, palavra por palavra no tempo da voz
   const PW='Eu só falo o que eu quero,'.split(' '),PT=wtimes(PW,6.18);let h='';
   PW.forEach((w,i)=>{if(t<PT[i]-.04)return;const n=Math.ceil(cl((t-PT[i]+.04)/.12)*w.length),v=w.slice(0,n);h+=(['falo','quero,'].includes(w)?`<span class="chip">${v}</span>`:v)+' '});
   return header(t,6.18,'eu só falo o que eu quero',2)+
   `<div class="a H" style="display:none;left:200px;top:300px;font-size:84px;color:#f3f3f3;opacity:${cl(pb*3)};transform:translateY(${(1-eo(pb))*30}px)">O PROMPT:</div>`+
   `<div class="a gl" style="left:200px;top:400px;width:1520px;height:330px;border:1.5px solid rgba(255,255,255,.2);border-radius:26px;transform:scaleY(${eo(pb)});transform-origin:top">
     <div class="a M" style="left:30px;top:22px;font-size:16px;color:#666">PROMPT &nbsp;·&nbsp; CLAUDE MOTION</div><div class="a M" style="right:30px;top:22px;font-size:16px;color:#666">⌘ + ENTER</div>
     <div class="a" style="left:40px;top:80px;width:1440px;white-space:normal;font:500 50px/1.5 'JetBrains Mono';color:#eaeaea">${h}<span style="color:${LIME};opacity:${Math.floor(t*4)%2}">▍</span></div></div>`;}},
 // 5. pipeline: PROMPT -> CLAUDE -> IDEIA -> HIGGSFIELD -> VIDEO
 {s:7.55,e:10.95,lab:'05 PIPELINE',f:t=>{
   const N=[['PROMPT',7.58],['CLAUDE',7.68],['IDEIA',8.56],[`<span style="font-size:1.2em;margin-right:.3em">${HF}</span>HIGGSFIELD`,9.30],['▶ VÍDEO',10.48]];
   const xs=[260,610,960,1310,1660];let h='';

{const sn=x=>{const v=snapB(x);return Math.abs(v-x)<.22?+v.toFixed(3):x};CLIPBG.forEach(r=>{r[0]=sn(r[0]);r[1]=sn(r[1]);r[3].forEach(c=>c[0]=sn(c[0]))})}
const LABEL={c1:'uma mulher montando um dragão',o1:'uma mulher voando num dragão',c2:'o dragão cuspindo fogo nos cavaleiros',o2:'cavaleiros invadindo a torre do dragão',c3:'orcs atacando com metralhadoras'};

function phone(src,{x=960,y=560,w=1060,rx=0,ry=0,rz=0,sc=1,glow=1,op=1}={}){const h=w*9/19.5*2.05/2;const H2=Math.round(w*0.5);

/* ---------- texto do motion = a narracao do Victor, palavra por palavra no tempo da voz ---------- */
