<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:#0b0705;overflow:hidden}
.bg{position:absolute;left:0;top:290px;width:1080px;height:1296px;background:url(fundo_exemplo.png) center/cover;filter:saturate(1.08) contrast(1.06)}
.tint{position:absolute;inset:0;background:
 linear-gradient(180deg,#0b0705 0%,#0b0705 15%,rgba(11,7,5,.55) 24%,rgba(11,7,5,0) 36%,rgba(11,7,5,0) 62%,rgba(11,7,5,.7) 74%,#0b0705 84%),
 radial-gradient(ellipse 70% 40% at 50% 52%,rgba(255,122,26,.0),rgba(11,7,5,.35));}

.t2{top:1395px;font-size:78px}

.top{position:absolute;left:50%;top:150px;transform:translateX(-50%);font:700 26px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#ff9a55;opacity:.9;white-space:nowrap}
